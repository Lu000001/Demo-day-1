<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title desc">
  <title id="title">MESSAGEix-China-Demo: energy and steel network</title>
  <desc id="desc">Orange boxes are technologies or explicitly grouped technology families. Blue nodes represent commodities, labelled with their actual model levels. Seven generation families supply secondary electricity, which the grid converts to final electricity. Coal and gas boilers supply final heat to fixed building district-heat demand. Direct fuels have separate fixed demands by carrier. Steel production uses ore, scrap, coal, coke and the same final-electricity balance, marked E, to meet fixed steel-product demand. Commodity groups contain separate balances, not interchangeable fuels. Sector identity bridges are omitted.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#42616f"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#344853;font-size:16px}
      .legend{font-size:13px;fill:#53615f}
      .technology{fill:#f0e6d9;stroke:#956641;stroke-width:1.2}
      .technology-name{font-size:16px;font-weight:600;fill:#805634}
      .detail{font-size:12px;fill:#53615f}
      .commodity{fill:#42616f}
      .commodity-name{font-size:16px;font-weight:600;fill:#42616f}
      .level{font-size:12.5px;fill:#53615f}
      .flow{fill:none;stroke:#42616f;stroke-width:1.7;stroke-linejoin:round;marker-end:url(#arrow)}
      .demand{font-size:16px;font-weight:600;fill:#496655}
      .demand-cap{stroke:#496655;stroke-width:3}
      .port{fill:#f5f4ef;stroke:#42616f;stroke-width:1.5}
      .port-letter{fill:#42616f;font-size:12px;font-weight:700}
      .port-note{font-size:12.5px;fill:#42616f}
    </style>
  </defs>

  <g aria-label="Legend">
    <circle cx="7" cy="13" r="4" class="commodity"/><text x="20" y="18" class="legend">Commodity (level)</text>
    <rect x="172" y="3" width="24" height="19" class="technology"/><text x="206" y="18" class="legend">Technology</text>
    <path d="M318 3V23" class="demand-cap"/><text x="330" y="18" class="legend">Fixed demand</text>
    <circle cx="460" cy="13" r="10" class="port"/><text x="460" y="17" text-anchor="middle" class="port-letter">E</text><text x="478" y="18" class="legend">Same final-electricity balance in both diagrams</text>
  </g>

  <!-- The fuel labels and parallel input arcs denote distinct commodities. -->
  <g aria-label="Electricity supply">
    <text x="0" y="65" class="commodity-name">Coal</text><circle cx="90" cy="60" r="3.5" class="commodity"/>
    <text x="0" y="84" class="commodity-name">Gas</text><circle cx="90" cy="79" r="3.5" class="commodity"/>
    <text x="0" y="103" class="commodity-name">Biomass</text><circle cx="90" cy="98" r="3.5" class="commodity"/>
    <text x="0" y="121" class="level">final · fuel-fired only</text>
    <path d="M90 60H130" class="flow"/>
    <path d="M90 79H130" class="flow"/>
    <path d="M90 98H130" class="flow"/>
    <rect x="130" y="52" width="155" height="54" class="technology"/>
    <text x="207.5" y="75" text-anchor="middle" class="technology-name">Power generation</text>
    <text x="207.5" y="94" text-anchor="middle" class="detail">7 technology families</text>
    <path d="M285 79H352" class="flow"/>
    <path d="M352 79H397" class="flow"/>
    <circle cx="352" cy="79" r="4.5" class="commodity"/>
    <text x="352" y="54" text-anchor="middle" class="commodity-name">Electricity</text>
    <text x="352" y="106" text-anchor="middle" class="level">secondary</text>
    <rect x="397" y="57" width="98" height="44" class="technology"/>
    <text x="446" y="76" text-anchor="middle" class="technology-name">Grid</text>
    <text x="446" y="93" text-anchor="middle" class="detail">5% loss</text>
    <path d="M495 79H565" class="flow"/>
    <path d="M565 79H660" class="flow"/>
    <circle cx="565" cy="79" r="4.5" class="commodity"/>
    <text x="565" y="54" text-anchor="middle" class="commodity-name">Electricity</text>
    <text x="552" y="106" text-anchor="end" class="level">final</text>
    <path d="M565 79V124H600" class="flow"/>
    <circle cx="610" cy="124" r="10" class="port"/><text x="610" y="128" text-anchor="middle" class="port-letter">E</text>
    <path d="M660 67V91" class="demand-cap"/>
    <text x="680" y="76" class="demand">Electricity demand</text>
    <text x="680" y="97" class="detail">Industry, transport, buildings</text>
  </g>

  <g aria-label="District heat supply">
    <text x="0" y="166" class="commodity-name">Coal</text><circle cx="90" cy="161" r="3.5" class="commodity"/>
    <text x="0" y="186" class="commodity-name">Gas</text><circle cx="90" cy="181" r="3.5" class="commodity"/>
    <text x="0" y="205" class="level">final</text>
    <path d="M90 161H130" class="flow"/>
    <path d="M90 181H130" class="flow"/>
    <rect x="130" y="149" width="155" height="44" class="technology"/>
    <text x="207.5" y="168" text-anchor="middle" class="technology-name">Heat boilers</text>
    <text x="207.5" y="185" text-anchor="middle" class="detail">Coal-fired / gas-fired</text>
    <path d="M285 171H565" class="flow"/>
    <path d="M565 171H660" class="flow"/>
    <circle cx="565" cy="171" r="4.5" class="commodity"/>
    <text x="565" y="149" text-anchor="middle" class="commodity-name">Heat</text>
    <text x="565" y="198" text-anchor="middle" class="level">final</text>
    <path d="M660 159V183" class="demand-cap"/>
    <text x="680" y="168" class="demand">District-heat demand</text>
    <text x="680" y="189" class="detail">Buildings</text>
  </g>

  <g aria-label="Independent direct fuel flows">
    <text x="0" y="239" class="commodity-name">Direct fuels</text>
    <text x="0" y="259" class="level">final · by carrier</text>
    <circle cx="145" cy="239" r="3" class="commodity"/><circle cx="145" cy="246" r="3" class="commodity"/><circle cx="145" cy="253" r="3" class="commodity"/>
    <path d="M145 239H660" class="flow"/>
    <path d="M145 246H660" class="flow"/>
    <path d="M145 253H660" class="flow"/>
    <text x="400" y="229" text-anchor="middle" class="detail">Separate commodity balances and demands</text>
    <path d="M660 234V258" class="demand-cap"/>
    <text x="680" y="243" class="demand">Fuel demand by carrier</text>
    <text x="680" y="264" class="detail">Industry, transport, buildings</text>
  </g>

  <g aria-label="Steel within the same energy network">
    <text x="0" y="318" class="commodity-name">Ore, scrap,</text><text x="0" y="338" class="commodity-name">coal and coke</text>
    <text x="0" y="359" class="detail">Separate inputs</text>
    <circle cx="145" cy="325" r="3" class="commodity"/><circle cx="145" cy="332" r="3" class="commodity"/><circle cx="145" cy="339" r="3" class="commodity"/>
    <path d="M145 325H343" class="flow"/>
    <path d="M145 332H343" class="flow"/>
    <path d="M145 339H343" class="flow"/>
    <rect x="343" y="310" width="152" height="44" class="technology"/>
    <text x="419" y="329" text-anchor="middle" class="technology-name">Steel production</text>
    <text x="419" y="347" text-anchor="middle" class="detail">BF–BOF / scrap EAF</text>
    <circle cx="419" cy="291" r="10" class="port"/><text x="419" y="295" text-anchor="middle" class="port-letter">E</text>
    <path d="M419 301V310" class="flow"/>
    <text x="443" y="296" class="port-note">Shared electricity input</text>
    <path d="M495 332H565" class="flow"/>
    <path d="M565 332H660" class="flow"/>
    <circle cx="565" cy="332" r="4.5" class="commodity"/>
    <text x="565" y="318" text-anchor="middle" class="commodity-name">Steel products</text>
    <text x="565" y="359" text-anchor="middle" class="level">product</text>
    <path d="M660 320V344" class="demand-cap"/>
    <text x="680" y="329" class="demand">Steel demand</text>
    <text x="680" y="350" class="detail">Fixed Mt/yr</text>
  </g>
</svg>
