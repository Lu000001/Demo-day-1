- Capacity|Electricity:
    unit: GW
    description: Total installed (available) electricity generation capacity
    source: IAMC common-definitions
    source_file: variable/energy/secondary-energy-electricity.yaml
- Capacity|Electricity|Biomass:
    unit: GW
    description: Installed (available) capacity to generate electricity from purpose-grown
      bioenergy crops, biogas, crop and forestry residue, municipal solid waste bioenergy
      and traditional biomass
    source: IAMC common-definitions
    source_file: variable/energy/secondary-energy-electricity.yaml
- Capacity|Electricity|Coal:
    unit: GW
    description: Installed (available) capacity to generate electricity from coal
      including lignite
    source: IAMC common-definitions
    source_file: variable/energy/secondary-energy-electricity.yaml
- Capacity|Electricity|Gas:
    unit: GW
    description: Installed (available) capacity to generate electricity from natural
      gas (fossil methane)
    source: IAMC common-definitions
    source_file: variable/energy/secondary-energy-electricity.yaml
- Capacity|Electricity|Hydro:
    unit: GW
    description: Installed (available) capacity to generate electricity from hydropower
    source: IAMC common-definitions
    source_file: variable/energy/secondary-energy-electricity.yaml
- Capacity|Electricity|Nuclear:
    unit: GW
    description: Installed (available) capacity to generate electricity from nuclear
      power
    source: IAMC common-definitions
    source_file: variable/energy/secondary-energy-electricity.yaml
- Capacity|Electricity|Solar:
    unit: GW
    description: Installed (available) capacity to generate electricity from solar
      energy
    source: IAMC common-definitions
    source_file: variable/energy/secondary-energy-electricity.yaml
- Capacity|Electricity|Wind:
    unit: GW
    description: Installed (available) capacity to generate electricity from wind
      power
    source: IAMC common-definitions
    source_file: variable/energy/secondary-energy-electricity.yaml
- Carbon Capture:
    unit: Mt CO2/yr
    description: Total amount of carbon dioxide (CO2) captured either from the atmosphere,
      directly from oceans, or from point sources as energy use in supply and demand
      sectors (IPCC category 1A, 1B) or industrial processes (IPCC categories 2A,
      B, C, E)
    source: IAMC common-definitions
    source_file: variable/emissions/carbon-management.yaml
- Carbon Capture|Geological Storage:
    unit: Mt CO2/yr
    description: Captured carbon dioxide (CO2) that is injected into subsurface geological
      storage reservoirs (e.g., in situ mineralization), also called 'Carbon Capture
      and Sequestration' (CCS)
    source: IAMC common-definitions
    source_file: variable/emissions/carbon-management.yaml
- Emissions|CO2:
    unit: Mt CO2/yr
    description: Emissions of carbon dioxide (CO2) to the atmosphere
    source: IAMC common-definitions
    source_file: variable/emissions/emissions.yaml
- Final Energy:
